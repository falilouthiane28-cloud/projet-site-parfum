<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique — Teranga, parfumerie à Dakar</title>
<meta name="description" content="41 parfums de niche et de prestige en rayon à Dakar. Filtrez par genre, famille olfactive, maison et prix. Prix en FCFA, livraison au Sénégal et dans la CEDEAO.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@300..600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"></noscript>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/lenis/1.1.13/lenis.min.js"></script>
<script defer src="assets/js/config.js"></script>
<script defer src="assets/js/data.js"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/shell.js"></script>
<script defer src="assets/js/product.js"></script>
<script defer src="assets/js/cart.js"></script>
<script defer src="assets/js/motion.js"></script>
<script defer src="assets/js/pages/boutique.js"></script>
</head>
<body data-page="boutique">
<a class="skip" href="#catalog">Aller au catalogue</a>
<main id="main">
  <header class="page-head wrap">
    <p class="eyebrow">La boutique</p>
    <h1 class="mt-2" id="shopTitle">Le catalogue</h1>
    <p id="shopIntro">Tous les parfums en rayon à Dakar. Touchez un flacon pour lire sa pyramide, ses notes et son sillage.</p>
  </header>

  <div class="filters" role="region" aria-label="Filtres du catalogue">
    <div class="filters__row" id="pillRow"></div>
    <div class="filters__tools">
      <span class="count" aria-live="polite"><b id="count">0</b><span id="countLabel">parfums</span></span>
      <div class="range">
        <label for="price">Prix max.</label>
        <input type="range" id="price" min="0" max="100" step="500">
        <output for="price" id="priceOut"></output>
      </div>
      <span class="spacer"></span>
      <label class="sort"><span class="visually-hidden">Trier par</span>
        <select id="sort">
          <option value="selection">Sélection</option>
          <option value="nouveautes">Nouveautés</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
          <option value="nom">Nom, de A à Z</option>
        </select>
      </label>
    </div>
  </div>

  <div class="wrap"><div class="catalog" id="catalog" tabindex="-1"></div></div>
</main>
</body>
</html>
